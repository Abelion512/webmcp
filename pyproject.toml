# Project tool configuration. Runtime stays stdlib-only (+ websockets);
# this file carries test-runner config only, no build backend, so that
# `import workspace_mcp` / `import bridge` keep working from the repo root.
# See docs/code-standards.md for the conventions behind these settings.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Repo root stays importable from tests/ (import bridge / workspace_mcp).
pythonpath = ["."]
