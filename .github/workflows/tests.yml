name: tests

# Runs the repo's existing zero-dependency suites: Python unit tests plus
# the Node stub-DOM smoke tests for the extension. Deliberately NOT
# Playwright/Puppeteer: the extension tests stub the DOM in plain Node
# (see snapgent-extension/test-chatgpt.js) and the repo ships no npm
# dependencies for the extension, so a browser download would be the
# heaviest part of the suite for the least coverage gain.
#
# Injection safety: no step interpolates untrusted event input into a
# shell command. Every run: block is a fixed string, and checkout uses
# the default ref, so a malicious PR title/body cannot inject commands
# into this workflow.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Explicit pip cache. This replaces setup-python's implicit `cache: pip`
      # so the key and restore behaviour are visible in the workflow: the key is
      # the pinned requirements hash, and restore-keys reuses the previous entry
      # when the pins change instead of caching from scratch.
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install pytest websockets pyflakes
      - name: Python static check (unused imports/names)
        run: python -m pyflakes workspace_mcp.py bridge.py bridge_auth.py setup-config.py tests/*.py e2e/*.py
      - name: Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Extension stub-DOM tests
        run: |
          for file in snapgent-extension/background.js \
                      snapgent-extension/popup.js \
                      snapgent-extension/core/*.js; do
            node --check "$file"
          done
          node snapgent-extension/test-parser.js
          node snapgent-extension/test-chatgpt.js
          node snapgent-extension/test-meta.js
          node snapgent-extension/test-popup-status.js
          node snapgent-extension/test-pairing.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install e2e deps
        run: python -m pip install websockets

      # apt-get install consumes the .deb files it uses, so the archive cache is
      # primed with --download-only before the install and re-primed afterwards
      # for the post step. A warm cache installs with --no-download; a cold one
      # falls back to a normal download. The reinstall --download-only at the
      # end forces apt to fetch the .deb even though the package is installed.
      - name: Cache apt packages
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-bubblewrap-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-bubblewrap-

      - name: Install sandbox deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --download-only bubblewrap || true
          if ! sudo apt-get install -y --no-download bubblewrap; then
            sudo apt-get install -y bubblewrap
          fi
          sudo apt-get install -y --reinstall --download-only bubblewrap || true
      - name: Live e2e (real bridge + subprocess, ephemeral port)
        run: |
          if [ -f e2e/e2e_live.py ]; then
            python e2e/e2e_live.py
          else
            echo "e2e/e2e_live.py not present, skipping"
          fi
