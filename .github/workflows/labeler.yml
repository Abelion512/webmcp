name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# pull_request_target so forked PRs can be labelled too. The action only reads
# PR metadata and the base branch's .github/labeler.yml, and nothing from the PR
# is checked out, so the write token is never exposed to untrusted code.
jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
