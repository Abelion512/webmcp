name: Label pull requests

# pull_request (not pull_request_target) so the workflow runs from the merge ref:
# pull_request_target only ever uses the default branch, and this repository does
# its work on linux-stability. Fork PRs are skipped because their GITHUB_TOKEN is
# read-only, so labeling would fail instead of quietly doing nothing.
#
# workflow_dispatch labels an existing PR on demand (usually the first PR opened
# after this file landed).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to label
        required: true

jobs:
  label:
    name: Apply path labels
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # the size step labels through the issues API
    steps:
      - uses: actions/labeler@v7
        with:
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}

      # actions/labeler only understands file paths, so review size is computed
      # here: additions + deletions is what a reviewer actually has to read.
      - name: Apply size label
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { additions = 0, deletions = 0 } = context.payload.pull_request;
            const total = additions + deletions;
            const label = total < 20 ? "size/xs"
              : total < 100 ? "size/s"
              : total < 400 ? "size/m"
              : total < 1000 ? "size/l"
              : "size/xl";
            const sizes = ["size/xs", "size/s", "size/m", "size/l", "size/xl"];
            const current = context.payload.pull_request.labels.map((l) => l.name);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            for (const stale of sizes.filter((s) => s !== label && current.includes(s))) {
              await github.rest.issues.removeLabel({ ...repo, issue_number: context.issue.number, name: stale });
            }
            await github.rest.issues.addLabels({ ...repo, issue_number: context.issue.number, labels: [label] });
            core.info(`${total} changed lines (${additions} +, ${deletions} -) -> ${label}`);
