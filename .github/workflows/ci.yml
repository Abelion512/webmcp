name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v

  extension:
    name: Extension (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snapgent-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # core/*.js are loaded into pages and the worker, so a syntax error there
      # breaks the extension without failing any of the smoke tests.
      - name: Check extension syntax
        run: |
          set -euo pipefail
          for file in background.js popup.js core/*.js; do
            node --check "$file"
          done
      - name: Run smoke tests
        run: |
          set -euo pipefail
          for test in test-*.js; do
            echo "== $test"
            node "$test"
          done
