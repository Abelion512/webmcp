# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabotyml-file
#
# The repo has three updatable surfaces:
#   - requirements.txt     Python runtime pin of bridge.py (websockets)
#   - snapgent-app/        Electron shell (package.json + package-lock.json)
#   - .github/workflows/   actions pinned by tag (checkout, setup-python, ...)
# The browser extension has no package.json by design (zero npm deps), so it
# deliberately gets no npm entry.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-runtime:
        patterns:
          - "websockets"

  - package-ecosystem: "npm"
    directory: "/snapgent-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "actions/*"
